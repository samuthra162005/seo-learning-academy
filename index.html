  <script>
    // Embedded Data with 100% Fidelity
    const BASE_L = [{"t":"Business overview","s":[["Why start here","Before an audit, learn the business. SEO should support the business, not just rankings."],["What to find out","What the business offers, its target audience, service areas, main services or products, primary conversion goal and current SEO objectives."],["Also check","Competitors, existing organic traffic, commercially important pages, and the analytics and tracking already in place."]],"m":"Starting with keywords or tools before understanding the business goal.","k":"Understand the business first. Then every fix can be tied to a goal.","q":[["What comes before an SEO audit?",["Buying links","Understanding the business","Rewriting titles"],1,"Goals decide what matters."],["SEO should mainly support…",["Business objectives","Only rankings","Only traffic"],0,"Rankings are a means, not the goal."],["A primary conversion goal is…",["The main action you want visitors to take","Your top keyword","A ranking report"],0,"For example a call or form lead."]],"v":[["c","Before the audit, I understand",["What the business offers","Target audience","Service areas","Main services or products","Primary conversion goal","Current SEO objectives"]],["q","SEO should support the business, not just rankings."]],"p":"Learn what the business sells and who it serves before touching SEO. Every fix should help a business goal.","f":"A biryani shop ranks for “pizza recipes” and gets 10,000 visits but no orders. Visitors came, but nobody wanted biryani. Knowing the business first means you chase clicks that fill tables.","y":"Write down what we sell, who buys, where they live and the one action we want (call, form or visit).","a":["🦁","Leo the Lion"],"mv":"In Soorarai Pottru, Maara studies the people who cannot afford to fly before building a low-cost airline. Know your customers first; then your SEO plan has a purpose."},{"e":"🔎","t":"How search works","s":[["Crawling","Search engine bots discover pages by following links and sitemaps, then request them. If a bot cannot reach a page, it cannot be found."],["Rendering","Engines may run JavaScript and load resources to see the page as a visitor does. Content that only appears after scripts run can be missed if rendering fails."],["Indexing","The engine analyses the page and decides whether to store it in its index. Duplicate and low-value pages are often left out."],["Ranking","For each query the engine picks relevant indexed pages and orders them. Crawled does not mean indexed, and indexed does not mean ranked well."]],"m":"Believing every published page will rank. Visibility is earned page by page.","k":"SEO helps engines discover, understand and index your pages so they can potentially rank. It never guarantees a position.","q":[["Which order does search follow?",["Rank, crawl, index","Crawl, render, index, rank","Index, crawl, rank"],1,"Pages are found, processed, stored, then ranked for queries."],["Is every indexed page guaranteed a strong ranking?",["Yes","No, indexing only makes it eligible","Only with schema"],1,"Indexing does not guarantee rankings."],["What is rendering?",["Processing JavaScript and resources to see the page like a visitor","Paying for ads","Buying links"],0,"Rendering lets engines understand content that scripts build."]],"p":"Search engines find pages, read them, store them, then pick the best ones for each question. A page can be found but never shown.","f":"Think of a library. The bot is a librarian walking every aisle (crawl), reading the book (render), shelving it (index) and choosing books for each visitor (rank). Being on the shelf does not mean being picked.","y":"Search site:yourdomain.com on Google and see how many of your pages appear.","a":["🐜","Anty the Ant"],"mv":"In Kaithi, Dilli must drive through one long night, past many checkpoints, to reach the hospital. Your page also passes checkpoints (crawl, render, index) before any viewer reaches it."},{"e":"🔑","t":"Keyword research","s":[["Keyword types","Short-tail (running shoes) is broad. Long-tail (best running shoes for flat feet) is specific. Keywords can also be branded or non-branded, local, or question-based."],["Search intent","Informational: the person wants to learn. Navigational: to reach a site. Commercial: to compare. Transactional: to buy. Match each page to one clear intent."],["The process","Understand the business, brainstorm seed keywords, check Google Keyword Planner or Trends, study the top results, group related terms into clusters, then map each cluster to a page."],["Reading the numbers","Search volume and difficulty are third-party estimates. Prioritise by relevance and business value, not volume alone."]],"m":"Chasing “LSI keywords”. It is old SEO jargon, not a Google requirement. Cover the topic naturally instead.","k":"Find what real people search, understand why, and give each page one clear purpose.","q":[["“Best running shoes for flat feet” is a…",["Short-tail keyword","Long-tail keyword","Branded keyword"],1,"Specific, multi-word searches are long-tail."],["Someone searches “buy running shoes online”. What intent?",["Informational","Transactional","Navigational"],1,"They are ready to buy."],["LSI keywords are…",["A Google ranking requirement","Not a recognised Google requirement","Official Search Console data"],1,"Google does not require LSI keyword optimisation."]],"v":[["t","Keyword map (sample)",["Keyword","Search volume","Intent","Current position"],[["seo audit tool","4.4K","Informational",12],["technical seo audit","2.9K","Informational",18],["on-page seo checklist","1.9K","Informational",9],["keyword research service","1.6K","Commercial",23],["seo audit services","1.3K","Commercial",16]],1],["c","I analyse",["Current ranking keywords","Target keywords","Search volume","Search intent","Keyword opportunities","Keyword-to-page mapping"]],["c","Keyword research process",["Understand the business and audience","Brainstorm seed keywords","Search relevant keyword tools","Study search intent","Review estimated search volume","Review keyword difficulty estimates (third-party)","Analyse the top search results","Identify long-tail and question keywords","Compare competitor keyword coverage","Group related keywords into clusters","Assign keywords to suitable pages","Prioritise by relevance and business value"]],["x","Keyword mapping fields",["Keyword","Search intent","Estimated volume","Difficulty estimate","Target page","Existing ranking","Competitor ranking","Priority","Status"]],["x","Types of keywords",["Short-tail","Long-tail","Branded","Non-branded","Informational","Navigational","Commercial","Transactional","Local","Question-based"]],["q","The goal isn’t to target more keywords. It’s to target the right keywords on the right pages."]],"p":"Keywords are the words people type. Match each page to what the searcher really wants.","f":"Shouting “shoes” in a mall reaches everyone and sells to no one. Asking for “white school shoes size 5 Erode” reaches one buyer who is ready. Longer searches are fewer but warmer.","y":"Pick one page. Write its main keyword, the intent behind it (learn, compare, buy) and one long-tail version.","a":["🦊","Foxy the Fox"],"mv":"Vikram Vedha keeps asking the question behind the question. Do the same with keywords: what does the person typing really want?"},{"t":"Competitor analysis","s":[["Business vs SEO competitors","Your business rivals and the sites that rank for your keywords are not always the same. Compare yourself with the sites Google shows for your target searches."],["What to compare","Keywords competitors rank for that you do not, their top pages, content coverage, page structure, backlinks, local visibility and content gaps."],["Use it wisely","Find real opportunities and fill gaps with better, original content. Do not copy competitors."]],"m":"Copying a competitor’s page word for word.","k":"Use competitor research to find opportunities, not to reproduce competing content.","q":[["Who are your SEO competitors?",["Sites ranking for your target searches","Only your business rivals","Sites with the same logo colour"],0,"Search results decide who competes."],["Best use of competitor research?",["Finding opportunities","Copying pages","Buying their links"],0,"Learn, then do it better and original."],["A content gap is…",["A useful topic competitors cover that you do not","A broken link","A slow page"],0,"Fill it with helpful content."]],"v":[["t","Competitor comparison worksheet",["Factor","Your site","Competitor 1","Competitor 2"],[["Ranking keywords","Record data","Record data","Record data"],["Top-performing pages","Record data","Record data","Record data"],["Content coverage","Review","Review","Review"],["Page structure","Review","Review","Review"],["Backlinks","Review","Review","Review"],["Local visibility","Review","Review","Review"],["Content gaps","Record","Record","Record"]]],["c","Check these factors",["Ranking keywords: queries competitors appear for that you do not","Top pages: competitor pages attracting organic visibility","Content coverage: topics, explanations and details","Page structure: headings, sections, navigation and linking","Backlinks: relevant referring websites and link profiles","Local visibility: local presence where relevant","Content gaps: useful questions you have not answered"]],["q","Goal: use competitor research to identify relevant opportunities, not simply reproduce competing content."]],"p":"Compare your site with the sites Google already shows for your keywords, to find gaps and chances.","f":"Two chai stalls near the bus stand. You watch what the busy one sells and what it forgets to offer, then you serve the missing item better. You do not copy its whole menu.","y":"Search your main keyword. Note the top three sites, one thing each does well and one thing each misses.","a":["🐺","Wolfie the Wolf"],"mv":"Think of the kabaddi matches in Ghilli: you win by reading the opponents’ moves before you raid. Study competitors, then play your own game."},{"e":"📝","t":"On-page SEO","s":[["Title tags","Describe the page accurately and match the search intent. Make each title distinct. Google sets no fixed character count and may rewrite titles."],["Meta descriptions","A summary that search engines may use as the result snippet. Write it naturally, explain the page’s value and keep it unique."],["Headings","Use one clear H1, H2s for main sections and H3s for subsections. Headings should describe the content that follows."],["Links and images","Link to relevant pages with meaningful anchor text. Add descriptive alt text and compress images so pages load quickly."]],"m":"Stuffing keywords into titles and descriptions, or reusing the same title across pages.","k":"Clear, accurate, people-first pages beat keyword tricks.","q":[["Does Google require titles to be exactly 60 characters?",["Yes","No fixed count exists","Yes, on mobile"],1,"Length limits are rules of thumb, not Google rules."],["What is a meta description for?",["Guaranteeing rankings","Summarising the page for searchers","Hiding keywords"],1,"It may be used as the snippet."],["Why add internal links?",["Help visitors and engines find related pages","Hide pages","Replace sitemaps"],0,"They connect topics and reduce orphan pages."]],"p":"On-page SEO is how clearly one page explains itself to people and search engines.","f":"The title tag is the shop signboard, the meta description is the window poster, and headings are aisle labels. Confusing signs make shoppers walk out.","y":"Check one page: does the title say exactly what it is? Is there one H1? Do images have alt text?","v":[["c","On-page checklist",["Optimise the title tag","Write a relevant meta description","Use a clear heading structure (H1, H2, H3)","Improve content quality","Match the user’s search intent","Use keywords naturally","Use descriptive URLs","Add relevant internal links","Use meaningful anchor text","Add descriptive image alt text","Optimise image sizes","Improve mobile usability","Keep content readable","Include suitable calls to action"]],["t","Example",["Element","Example"],[["Title tag","10 Tips for Running Beginners | YourSite"],["Meta description","Discover beginner running tips, training plans and helpful advice for improving your daily running routine."],["H1","Best Running Tips for Beginners"],["H2s","How to Build Running Stamina, Breathing Techniques, Common Running Mistakes, Tips for Recovery"]]],["x","Internal links help you",["Help visitors navigate","Help engines discover pages","Explain topic relationships","Connect articles with key pages","Reduce orphan pages"]],["q","Titles and descriptions should be accurate and distinctive. Google sets no fixed character count."]],"a":["🦚","Mayil the Peacock"],"mv":"Anniyan is one man with three identities: Ambi, Remo and Anniyan. If a page’s title, heading and description each say something different, visitors and Google get confused. Keep one clear identity per page."},{"e":"🛠️","t":"Technical SEO","s":[["Redirects","301 is permanent and 302 is temporary. 307 and 308 are the temporary and permanent versions that keep the request method. Avoid chains and loops."],["Errors","404 means not found, 410 means intentionally removed, 5xx means a server problem. Fix important broken pages. Not every 404 needs a redirect."],["robots.txt and sitemaps","robots.txt guides crawling by compliant bots. It is not security, and blocking crawling is different from noindex. A sitemap should list only canonical, working, indexable URLs."],["Canonicals and speed","Canonical signals pick the preferred URL among duplicates (http/https, www, parameters). Good Core Web Vitals: LCP 2.5 s or less, INP 200 ms or less, CLS 0.1 or less."]],"m":"Accidentally blocking important folders in robots.txt, or listing noindexed URLs in the sitemap.","k":"If search engines cannot access, process and understand a page, great content cannot help.","q":[["A 301 redirect is…",["Temporary","Permanent","A server error"],1,"301 is permanent. 302 is temporary."],["Is robots.txt a security tool?",["Yes","No, it only guides compliant bots","Yes, it hides passwords"],1,"Never rely on it to protect private content."],["What is a good LCP?",["2.5 seconds or less","5 seconds","200 ms"],0,"200 ms is the INP threshold."]],"v":[["c","What is technical SEO, and why it matters",["Improves the technical structure so engines can crawl, index and understand pages","Improves website speed","Helps Google crawl your site","Better indexing","Improves user experience","Can support rankings"]],["c","I check: technical health",["3xx redirects","4xx/5xx errors","Broken links","HTTPS","XML sitemap","Robots.txt","Canonicals","Crawlability","Indexability"]],["t","Status codes to know",["Code","Meaning"],[["301","Permanent redirect"],["302","Temporary redirect"],["307","Temporary redirect that preserves the request method"],["308","Permanent redirect that preserves the request method"],["404","Not found. Not every 404 needs a redirect"],["410","Intentionally removed"],["500","Internal server error"],["503","Service temporarily unavailable"]]],["c","XML sitemap checklist",["Include canonical URLs","Avoid noindexed URLs","Avoid broken URLs","Use correct XML formatting","Submit to webmaster tools","Keep entries updated"]],["c","robots.txt checklist",["Check important crawl permissions","Review blocked folders","Check sitemap references","Avoid accidental blocking","It is not a security mechanism","Crawl blocking and noindex are different"]],["c","Canonical checks",["Canonical link element","Selected canonical","Duplicate URL variants","HTTP and HTTPS","www and non-www","Parameterised URLs"]],["q","Goal: make the website easy for search engines to crawl and understand. Good technical SEO helps both Google and users."]],"p":"Technical SEO makes sure bots can reach, read and understand your site.","f":"It is the road to your shop. A redirect chain is three detours, a 404 is a locked door, and blocking robots.txt by mistake is hanging a CLOSED sign for delivery trucks.","y":"Open yourdomain.com/robots.txt and /sitemap.xml. Do both load? Is anything important blocked?","a":["🐘","Yaanai the Elephant"],"mv":"In Michael Madana Kama Rajan, Kamal Haasan plays four characters in one film. Your site can also appear at four addresses (http, https, www, non-www). The canonical tag tells Google which one is the real hero."},{"t":"Website performance","s":[["Core Web Vitals","They measure real user experience: loading (LCP), responsiveness (INP, which replaced FID in 2024) and visual stability (CLS). Good: LCP 2.5 s or less, INP 200 ms or less, CLS 0.1 or less."],["Page speed and mobile","Check how fast pages load and how easy the site is on mobile: readable text, tap targets with space, no sideways scrolling and a configured viewport."],["Fixing it","Compress images, minify CSS and JavaScript, reduce server response time, use browser caching and optimise third-party resources."]],"m":"Trusting only a lab score. Compare field data (real users) with lab data.","k":"SEO brings the visitor. The website needs to keep them.","q":[["Which metric replaced FID?",["INP","TTFB","TTI"],0,"INP replaced FID in March 2024."],["Good CLS is…",["0.1 or less","2.5 s","200 ms"],0,"CLS has no unit."],["Heaviest resource in the sample?",["Images","Fonts","Styles"],0,"Images were about 991 KB."]],"v":[["k","Core Web Vitals, field data (sample)",[["LCP","1.6 s","Good, 2.5 s or less"],["FID shown in screenshot","38 ms","Good, 100 ms or less. Now INP, 200 ms or less"],["CLS","0.05","Good, 0.1 or less"]],1],["k","Page speed and mobile usability (sample)",[["Performance score","92","Good"],["First Contentful Paint","0.9 s"],["Speed Index","1.3 s"],["Time to Interactive","1.8 s"],["Mobile friendly","100%"]],1],["b","Resource summary, 1.42 MB total (sample)",[["Images",991],["Scripts (approx.)",256],["Styles",113],["Fonts",60]],"KB",1],["x","Opportunities",["Compress images","Minify CSS and JS","Reduce server response","Use browser caching","Optimise third-party resources"]],["c","I check",["Core Web Vitals","Page speed","Mobile usability","Image optimisation","Large resources","User experience"]],["q","SEO brings the visitor. The website needs to keep them."]],"p":"Fast, stable, mobile-friendly pages keep visitors happy and help search.","f":"A restaurant whose menu takes ten seconds to open loses guests. LCP is how fast the menu appears, and CLS is the waiter shifting your table while you order.","y":"Run your homepage in PageSpeed Insights. Note LCP, INP, CLS and the top two suggestions.","a":["🐆","Cheetah"],"mv":"Think of the cinema ticket queue. If the counter takes ten minutes, people leave before the interval. Slow pages lose visitors the same way."},{"t":"Content audit","s":[["What to check","Thin content, duplicate content, outdated content, missing service information, content gaps competitors cover, search intent alignment and E-E-A-T signals."],["Then decide","Keep what performs, improve what has potential, consolidate similar pages into one stronger page, and create content for gaps and opportunities."]],"m":"Merging or deleting pages without checking traffic, links and intent first.","k":"A content audit turns existing content into results. It does not guarantee rankings.","q":[["Several overlapping pages usually need…",["Consolidation","Deleting all","More keywords"],0,"Merge into one stronger page."],["Good content with potential should be…",["Improved","Left untouched","Created again"],0,"Optimise it."],["E-E-A-T is…",["A quality framework","A Google score","A tool"],0,"It is not a numeric ranking score."]],"v":[["t","Content audit checks",["Check","Meaning"],[["Thin content","Pages with little or no value for users"],["Duplicate content","Content replicated across pages or domains"],["Outdated content","Old or irrelevant content that needs updates"],["Missing service information","Important services or details not covered"],["Content gaps","Topics competitors rank for that you don’t cover"],["Search intent alignment","Content matches what users actually search for"],["E-E-A-T signals","Experience, Expertise, Authoritativeness, Trustworthiness"]]],["t","Then I identify",["Decision","When to use it"],[["Keep","High-performing content that adds value"],["Improve","Good content with potential that needs optimisation"],["Consolidate","Similar content can be merged into one stronger page"],["Create","New content to fill gaps and target opportunities"]]]],"p":"A content audit decides what to keep, improve, merge or create.","f":"Clean your wardrobe: keep the favourites, alter what almost fits, merge three similar shirts into one good one, and buy what is missing.","y":"List ten pages. Label each Keep, Improve, Consolidate or Create, with one reason.","a":["🐿️","Squirrel"],"mv":"A film editor trims repeated scenes (consolidate), reshoots weak ones (improve), keeps the best (keep) and adds a missing scene (create)."},{"t":"Content marketing and blogging","s":[["Content marketing","Creating and sharing valuable, relevant and consistent content to attract a target audience. It builds brand awareness, organic traffic, quality leads, customer trust and sales."],["Blogging","Publishing valuable articles on your website to educate, inform or solve your audience’s problems. It can increase organic traffic, support SEO, build authority and generate leads."],["Writing an SEO blog","Choose a target keyword, understand search intent, write a catchy title, use H1, H2 and H3 headings, add images and internal links, then end with a clear CTA."]],"m":"No keyword research, weak headlines, long paragraphs, no internal links, duplicate content and no CTA.","k":"Write for your audience, give real value, stay consistent and update old content.","q":[["What follows choosing a keyword?",["Understanding search intent","Adding images","Publishing"],0,"Intent shapes the whole post."],["A blog should end with…",["A clear CTA","A keyword list","Nothing"],0,"Give the reader a next step."],["Long dense paragraphs are…",["A common mistake","Best practice","Required"],0,"Short paragraphs read easier."]],"v":[["x","Types of content marketing",["Blog posts","Videos","Social media posts","Email newsletters","Podcasts","E-books and guides"]],["x","Types of blog posts",["How-to guides","Listicles","FAQs","Case studies","Industry news","Tutorials"]],["c","Blog structure",["Catchy title","Introduction","Main content","Images","FAQ section","Conclusion and CTA"]],["w","Common blogging mistakes",["No keyword research","Weak headlines","Long paragraphs","No internal links","Duplicate content","No CTA"]],["c","Blogging best practices",["Write for your audience","Publish consistently","Optimise for SEO","Update old blogs","Use engaging visuals","Track performance"]],["c","Blogging checklist",["Keyword research","SEO-friendly title","Proper headings","Internal and external links","Optimised images","Meta title and description","Clear CTA"]],["c","Content marketing checklist",["Know your audience","Keyword research","Valuable content","SEO optimisation","Content promotion","Performance tracking","Content updates"]]],"p":"Useful content earns attention and trust. Selling comes second.","f":"A tea stall owner posts “perfect filter coffee at home” reels. People trust him, and later they buy his beans. Help first, sell next.","y":"Plan one blog: keyword, search intent, title, H2 headings and the CTA.","a":["🦜","Kili the Parrot"],"mv":"A Tamil film trailer gives you a taste of the story before you buy a ticket. Your blog is the trailer of your expertise: be useful first, sell later."},{"e":"🔗","t":"Backlinks","s":[["What counts","A backlink is a link from another site to yours. Look at referring domains, relevance, anchor text and whether links are followed or nofollow."],["Earning links","Editorial links, digital PR, genuine guest contributions, partners, resource pages and broken-link outreach all start with something worth linking to."],["Platforms","BizSugar, Blogger, Tumblr, Slashdot, Medium and Reddit are communities. Judge each by real audience value, not by the link alone."],["Warning signs","Paid links meant to manipulate rankings, link networks, mass directory submissions and spam comments. Not every odd link needs a disavow."]],"m":"Treating Domain Authority or Domain Rating as Google scores. Moz and Ahrefs created them.","k":"Earn relevant links by being genuinely useful, not by publishing hundreds of links.","q":[["Domain Authority comes from…",["Google","Moz","Bing"],1,"Third-party metrics are not Google ranking scores."],["Does a .edu link automatically add value?",["Yes, always","No, relevance and context matter","Only .gov does"],1,"The extension alone proves nothing."],["Which approach is healthy?",["Publish hundreds of links quickly","Create content others want to cite","Buy a link network"],1,"Linkable assets earn editorial links."]],"v":[["k","Backlink profile (sample)",[["Referring domains","1,248","▲ 12.4%"],["Backlinks","8,634","▲ 8.7%"],["Domain Authority (Moz)","42","▲ 3"],["Page Authority (Moz)","36","▲ 2"],["Spam score","4%","▼ 2%"]],1],["p","Backlink quality, 1,248 referring domains (sample)",[["High quality 52.2%",652],["Medium quality 34.6%",432],["Low quality 9.9%",124],["Toxic 3.3%",40]],1],["p","Top anchor text distribution (sample)",[["Branded 28.5%",28.5],["Partial match 24.3%",24.3],["Generic 18.6%",18.6],["Exact match 15.7%",15.7],["Other 12.9%",12.9]],1],["t","Lost backlinks (sample)",["Domain","Lost date"],[["example-news.com","May 12, 2024"],["bestblog.com","Apr 28, 2024"],["techsite.org","Apr 20, 2024"],["designhub.net","Apr 15, 2024"],["trendinginfo.com","Apr 05, 2024"]],1],["b","Top competitor backlinks (sample)",[["competitor1.com",3246],["competitor2.com",2187],["competitor3.com",1862],["competitor4.com",1243],["competitor5.com",986]],"links",1],["b","Potential spam signals (sample)",[["Irrelevant links",126],["Link farms / PBNs",18],["Malicious links",6]],"",1],["c","I analyse",["Referring domains: unique domains linking to the site","Backlink quality: authority and trust of linking domains","Relevant links: from related websites","Anchor text distribution and diversity","Lost backlinks that may have impacted rankings","Competitor backlinks: where competitors earn links","Potential spam signals: low-DA links, PBNs, spammy anchors, irrelevant and malicious links"]],["x","Link-building methods",["Editorial links","Guest posting","Digital PR","Business directories","Resource pages","Broken-link outreach","Partner links","Community participation","Linkable content"]],["x","Platforms to judge by audience value, not link count",["BizSugar","Blogger","Tumblr","Slashdot","Medium","Reddit","Quora","Industry forums","Professional communities","News publications"]],["w","Suspicious backlink indicators",["Paid links meant to manipulate rankings","Automated link networks","Large-scale link exchanges","Irrelevant mass directory submissions","Spam comments","Manipulative anchor text","Private blog networks"]],["q","I focus on relevance and quality, not just backlink numbers. Domain Authority is a Moz metric and “toxic” labels come from third-party tools, so neither is a Google score."]],"p":"Backlinks are other sites recommending you. Relevant, earned links matter most.","f":"One respected doctor recommending your clinic beats a thousand flyers thrown on the road. Paying for fake recommendations can get you in trouble.","y":"List five real sites (partners, local news, suppliers) that could genuinely link to you.","a":["🐝","Theni the Bee"],"mv":"In Thalapathi, the friendship between Surya and Devaraj is real, not staged. Good links come from real relationships too. Bought friendships show."},{"e":"📍","t":"Local SEO","s":[["Local intent","Searches like “dentist near me” or “restaurant in Chennai” trigger map results. Google Business Profile is the key tool for eligible businesses."],["Ranking ideas","Relevance is how well you match the search. Distance is how far you are from the searcher’s location. Prominence is how well known you are."],["NAP consistency","Keep Name, Address and Phone identical across your website, Business Profile, Bing Places, Apple Business Connect and citations."],["Reviews and photos","Ask for genuine reviews without incentives, reply professionally, add real photos and keep hours and services accurate."]],"m":"Offering rewards for reviews, or leaving outdated hours and duplicate listings.","k":"Accurate, consistent business details plus genuine customer feedback build local visibility.","q":[["NAP stands for…",["Name, Address, Phone","New Add Page","Network Access Protocol"],0,"Keep it consistent everywhere."],["Which is NOT a local ranking idea?",["Distance","Prominence","Meta keywords tag"],2,"Relevance, distance and prominence are the three."],["Best way to get reviews?",["Pay customers","Ask genuine customers without incentives","Write them yourself"],1,"Incentivised or fake reviews cause problems."]],"v":[["c","What is Google Business Profile, and why it matters",["Free Google tool to manage how you appear on Search and Maps","Helps customers find, contact and visit your business","Appears on Google Search and Maps","Increases local visibility and builds trust","Drives calls, visits and website clicks","Generates more local leads"]],["c","Essential profile elements",["Business name","Business address","Phone number","Website","Business hours","Business category","Photos and videos","Customer reviews"]],["c","Local SEO ranking factors",["Google Business Profile","Customer reviews","NAP consistency","Local citations","Location pages"]],["c","For local businesses, I review",["Google Business Profile: optimise for local visibility","Primary and secondary categories","Business information: accurate and complete","Reviews: monitor, manage and build","Local landing pages for city or location","NAP consistency: Name, Address, Phone","Local keywords with proper intent","Citations on trusted directories"]],["k","Business insights, last 28 days (sample)",[["Views","4,256"],["Searches","2,189"],["Map views","1,324"],["Calls","245"],["Messages","38"]],1],["b","Map pack: average rating (sample)",[["1 Your Business (128 reviews)",4.8],["2 Competitor A (86 reviews)",4.3],["3 Competitor B (64 reviews)",3.9]],"stars",1],["b","Review summary, 128 reviews (sample)",[["5 stars",102],["4 stars",18],["2 stars",2],["1 star",1]],"",1],["x","Top local keywords (sample)",["plumber in indore","best plumber indore","bathroom fitting indore","emergency plumber indore","water tank cleaning indore","plumbing services indore"],1],["c","30-day Business Profile plan: days 1-10",["Day 1: claim and verify the eligible profile","Day 2: complete accurate business information","Day 3: choose appropriate categories","Day 4: write an accurate description","Day 5: add eligible products and services","Day 6: upload genuine, high-quality photos","Day 7: confirm regular and special opening hours","Day 8: add relevant contact information","Day 9: review available business attributes","Day 10: publish a useful business update"]],["c","Days 11-20",["Day 11: prepare a realistic posting schedule","Day 12: publish a relevant update or offer","Day 13: request genuine reviews without incentives","Day 14: respond to existing reviews","Day 15: review customer questions and answers","Day 16: confirm service areas","Day 17: check local citations","Day 18: share the profile with customers where useful","Day 19: add genuine photos or short videos","Day 20: share a useful service update"]],["c","Days 21-30",["Day 21: review and improve the description","Day 22: review customer engagement data","Day 23: add genuine team, office or work photos","Day 24: share event information if applicable","Day 25: review Business Profile performance metrics","Day 26: share a real customer story with permission","Day 27: improve accuracy of services and information","Day 28: remove outdated information, photos or offers","Day 29: continue legitimate review requests","Day 30: evaluate results and plan next month"]],["q","Not all features are available to every business type or region. No fixed review target guarantees better rankings."],["q","Local visibility is more than putting a city name on a page. More local visibility = more local customers."]],"p":"Local SEO helps nearby people find and trust your business.","f":"Searching “tailor near me”: Google picks the tailor who matches the search (relevance), is nearest (distance) and is well known (prominence). Same name, address and phone everywhere keeps things clear.","y":"Search your business name. Check that name, address and phone match on Google, your website and one directory.","a":["🐕","Kutty the Street Dog"],"mv":"In Baasha, Manikam the auto driver is trusted by his lane. A local business wins the same way: the neighbourhood knows it, trusts it and talks about it."},{"e":"📊","t":"Search Console, GA4 and GTM","s":[["Search Console","A free Google tool showing how your site performs in Google Search: clicks, impressions, CTR, average position, indexing and sitemaps. CTR = clicks ÷ impressions × 100."],["GA4","Measures what visitors do on your site: users, sessions, engagement, events and key events. Test events and avoid duplicate tracking."],["Tag Manager","Deploys tracking without editing code each time. Tags are tracking code, triggers decide when tags fire, variables hold values. Test in Preview mode before publishing."],["Reading the data","High impressions with low CTR suggests a stronger title or description. Pages that are declining deserve investigation."]],"m":"Deciding from a single metric, or publishing tracking without testing it.","k":"Search Console shows how you appear in Google. GA4 shows what visitors do next.","q":[["CTR for 50 clicks and 1,000 impressions?",["5%","50%","0.5%"],0,"50 ÷ 1,000 × 100 = 5%."],["High impressions, low CTR. First idea?",["Improve the title and description","Delete the page","Buy links"],0,"Make the result more appealing and accurate."],["A GTM trigger is…",["The tracking code","The condition that fires a tag","A report"],1,"Tags are the code. Triggers decide when they run."]],"v":[["k","Search Console performance, last 3 months (sample)",[["Total clicks","1.24K"],["Total impressions","85.6K"],["Average CTR","1.45%"],["Average position","23.7"]],1],["p","Coverage (sample)",[["Indexed pages: 321 (74.1%)",321],["Non-indexed pages: 112 (25.9%)",112]],1],["k","Indexing (sample)",[["Pages with indexing issues","18"]],1],["c","Search Console: I check",["Indexed pages","Non-indexed pages","Search queries","Clicks","Impressions","CTR","Average position","Indexing issues"]],["q","This shows the gap between what exists on the website and what Google can actually surface."],["c","Search Console: what it is and key features",["Free Google tool to monitor performance in Search, find issues and grow organic traffic","Performance report: total clicks, impressions, average CTR, average position, top queries, top pages","URL Inspection","Links report","Index coverage","Mobile usability","Sitemaps"]],["c","How Search Console works",["Publish content on your website","Google crawls and indexes your site","Data shown in Search Console","Analyse the data, fix and optimise","Improve rankings and traffic"]],["c","Search Console checklist and best practices",["Verify website","Submit XML sitemap","Check index coverage","Fix errors and warnings","Review search queries","Optimise title and meta tags","Monitor mobile usability","Track backlinks"]],["w","Common Search Console mistakes",["Ignoring performance data","Not submitting a sitemap","Not fixing index issues","Ignoring mobile usability"]],["c","GA4: what it is and why it matters",["Free analytics tool that tracks website and app user behaviour","Tracks website traffic","Understands user behaviour","Measures conversions","Identifies top-performing pages","Improves marketing decisions"]],["x","Key GA4 metrics",["Users","Views","Engagement time","Bounce rate","Conversions","Events"]],["x","Essential GA4 reports",["Realtime","Acquisition","Pages and screens","Engagement","Monetisation","Advertising"]],["c","How GA4 works",["User visits your website","GA4 collects events","Data is processed","Reports are generated","Analyse insights","Optimise your marketing"]],["c","GA4 checklist and best practices",["GA4 installed","Events configured","Conversions (key events) set up","Google Ads linked","Reports reviewed weekly","Traffic sources monitored","Goals optimised"]],["w","Common GA4 mistakes",["Not setting up conversions","Ignoring event tracking","No filters or exclusions","Not linking Google Ads","Checking data too rarely","Making decisions without data"]],["q","Data tells you what’s happening. Insights tell you what to do next. Action drives results. Track. Analyse. Improve. Grow."]],"p":"Search Console shows how you appear in Google. GA4 shows what visitors do on your site.","f":"Search Console is the street board counting people who saw your shop and walked to the door. GA4 is the CCTV inside: what they did after entering.","y":"In Search Console, find one page with many impressions but low CTR. Write a better title for it.","a":["🦉","Owl"],"mv":"In Thuppakki, Jagdish studies maps and information before every move. Check Search Console and GA4 before you edit, just like that."},{"e":"🤖","t":"AEO, GEO and AI search","s":[["AEO","Answer engine optimisation: answer the main question clearly, use descriptive headings and short definitions, add lists or tables where they help, and cover related questions."],["GEO","Make content easy for AI search (AI Overviews, ChatGPT search, Perplexity, Copilot) to find and trust: original information, credible sources, consistent business facts and crawlable pages."],["Measuring","Watch AI referral traffic, brand mentions and citations. Platforms retrieve differently and results vary between queries."],["Verify everything","AI explains, Google confirms. Check indexing in Search Console and read official docs. Treat llms.txt and citability scores as experimental."]],"m":"Promising a guaranteed AI citation. No content format can do that.","k":"The foundations are the same: original, credible, accessible content.","q":[["Can any structure guarantee inclusion in AI answers?",["Yes, FAQ schema","No","Yes, llms.txt"],1,"Nothing guarantees placement."],["“AI explains, Google confirms” means…",["Trust AI blindly","Verify AI advice with Google tools and official docs","Skip Search Console"],1,"Always check indexing and sources."],["A solid GEO foundation is…",["Original, credible, crawlable content","Keyword repetition","Hidden text"],0,"Quality and access come first."]],"v":[["t","Layers of SEO: from search to AI",["Layer","Goal","Work on","Key signals"],[["SEO","Strong foundation for organic discovery","Search intent, site architecture, keyword clusters, crawlability, internal linking, topical depth","Organic impressions, keyword positions, search traffic, pages indexed"],["AEO","Make content easy for answer engines","Direct responses, ask and engage, FAQ sections, structured answers","Answer visibility, featured results, query coverage, brand recognition"],["GEO","Increase the chances of your brand appearing in AI","Original insights, supporting evidence, brand authority, expert contributions","AI mentions, brand citations, source references, recommendations"],["AIO","Make your digital presence AI-ready and clear","Clear entities, consistent information, semantic relationships, machine-friendly content","Entity recognition, AI discoverability, information accuracy, contextual relevance"],["SXO","Turn search visitors into engaged users and clients","Page experience, content clarity, mobile usability, navigation flow","Engagement, time on page, lead generation, conversion rate, returning visitors"]]],["q","Better content, bigger visibility. SEO is no longer just about ranking on Google, but these signals are things to track, not guarantees of AI visibility."]],"p":"Make answers clear and sources credible so people and AI tools can understand you. Nothing is guaranteed.","f":"AEO is the shopkeeper who answers in one clear line. GEO is being so trustworthy that when someone asks an AI for the best dentist in town, your name may come up. No one can promise it.","y":"Take one page. Add a two-line direct answer at the top and one trustworthy source.","a":["🐬","Dolphin"],"mv":"In Jailer, Muthuvel Pandian’s reputation speaks before he does. GEO is similar: trust built across the web, not one clever trick."},{"t":"SEO score and priorities","s":[["Turning an audit into a plan","Group findings by category, then rank each by impact and effort. Fix critical issues first, then improve and scale consistently."],["Priority levels","Critical: fix immediately, high-impact issues hurting rankings. High: important issues needing attention soon. Medium: moderate-impact improvements. Low: nice-to-have items for the future."],["About the score","The 71/100 in the reference is a custom, sample score. It is not a Google rating, so document how any score is calculated."]],"m":"Showing one score as if it were official or objective evidence.","k":"Fix critical issues first. Then improve and scale consistently.","q":[["Which issue goes first?",["Indexing blocks on key pages","Image ALT text","Old posts"],0,"Critical issues hurt most."],["Is a 71/100 SEO score a Google rating?",["No, it is a custom score","Yes","Only for local"],0,"Define your own method."],["Priority combines impact and…",["Effort","Colour","Word count"],0,"Quick high-impact wins go first."]],"v":[["g","Category scores (sample)",[[78,"Technical SEO","Good"],[65,"On-page SEO","Needs work"],[72,"Content","Good"],[81,"Local SEO","Very good"],[58,"Authority","Needs work"],[71,"Overall","Good"]],1],["t","Priority action plan (sample)",["Priority","Issue","Details","Impact","Effort"],[["Critical","4xx/5xx errors","Multiple pages return errors, harming crawlability and user experience","Very high","Medium"],["Critical","Indexing issues","Important pages are not indexed or are blocked","Very high","Medium"],["High","Title and meta optimisation","Missing or poorly optimised title tags and meta descriptions","High","Low"],["High","Thin and low-value content","Pages with thin content or that do not match search intent","High","Medium"],["Medium","Internal linking","Improve links to important pages and distribute authority","Medium","Low"],["Medium","Image optimisation","Optimise images, file sizes and ALT text","Medium","Low"],["Low","Schema markup","Add and expand structured data for rich results","Low","Medium"],["Low","Content updates","Update outdated content to improve relevance","Low","Low"]],1]],"p":"Rank problems by impact and effort. Fix the worst first.","f":"Like hospital triage: stop the heavy bleeding (critical) before the small scratch (low). A 71/100 score is a custom report card, not a government exam.","y":"Write five issues, then give each an impact, an effort and a Critical, High, Medium or Low label.","a":["🐙","Octo the Octopus"],"mv":"In action films like Vikram, the team handles the biggest threat first, then the smaller ones. Prioritise your SEO issues the same way."},{"t":"Weekly workflow and reporting","s":[["A seven-day rhythm","Monday keyword research, Tuesday competitor analysis, Wednesday on-page SEO, Thursday content planning, Friday content creation, Saturday technical audit, Sunday review and reporting. It is a weekly work plan, not a promise of results in seven days."],["What to report","Organic clicks and impressions (Search Console), CTR = clicks ÷ impressions × 100, average position, organic sessions (GA4), conversion rate = conversions ÷ sessions × 100, leads, referring domains and documented AI mentions."],["Check the source","Compare every number with its source tool and the same time period. Record what you changed and when."]],"m":"Reporting rankings alone. Leads and sales matter more.","k":"A steady weekly routine beats a one-week sprint.","q":[["How do you calculate CTR?",["Clicks ÷ impressions × 100","Impressions ÷ clicks","Clicks × position"],0,"CTR is the share of impressions that got a click."],["Does a seven-day plan guarantee rankings?",["Yes","No, it is a work routine","Only with tools"],1,"Results take time."],["Which metric shows business results?",["Leads and conversions","Average position only","Page count"],0,"SEO should support the business."]],"v":[["t","Seven-day SEO workflow",["Day","SEO activity","Suggested tool"],[["Monday","Keyword research","Semrush / Ahrefs"],["Tuesday","Competitor analysis","Ahrefs"],["Wednesday","On-page SEO","Yoast SEO / page inspection"],["Thursday","Content planning","GSC / keyword research"],["Friday","Content creation","Grammarly / editor"],["Saturday","Technical SEO audit","Screaming Frog"],["Sunday","Review and reporting","GA4 / GSC"]]],["x","Metrics to report",["Organic clicks","Organic impressions","CTR","Average position","Organic sessions","Conversion rate","Leads","Referring domains","AI visibility (citations, referrals, mentions)"]],["q","Track business outcomes, not only ranking numbers."]],"p":"A steady weekly routine and honest reporting beat a one-week sprint.","f":"Going to the gym for seven days does not build muscles; a plan repeated for months does. SEO works the same way.","y":"Create a weekly calendar: one task per day from the table, with the tool you will use.","a":["🐢","Tortoise"],"mv":"In Jai Bhim, Chandru gathers evidence step by step and records everything. Steady, documented SEO work beats a one-day rush."},{"t":"AI prompts for SEO","s":[["AI explains. Google confirms.","Use AI to explain, draft and organise. Then verify in Search Console, PageSpeed Insights and official documentation."],["Good prompts","Give the page or data, the target keyword, the goal and the format you want. Tell the AI not to invent data it cannot see."],["Verify","Check indexing in Search Console, retest speed, open the real source URLs, re-run audits after changes and keep a record."]],"m":"Pasting AI advice into a site without checking it.","k":"Use AI for speed and Google tools for proof.","q":[["“AI explains. Google ___.”",["confirms","guesses","hides"],0,"Verify with Google tools."],["Should AI invent data it cannot see?",["Yes","No","Only for schema"],1,"Tell it to use verified data only."],["A schema prompt must use…",["Verified details only","Made-up reviews","Any rating"],0,"Never invent ratings or addresses."]],"v":[["pr","Copy-ready prompts",[["Full on-page audit","Act as an SEO specialist. Review the supplied URL or page text for the target keyword. Evaluate title tag, meta description, heading structure, search intent, content usefulness, internal links, image alt text and missing information. Separate verified issues from suggestions. Give an issue list, explanations, priorities and fixes. Do not invent data you cannot inspect."],["Title and meta rewrite","Write five relevant SEO title tag options and five meta descriptions for the provided page and target keyword. Keep each clear, natural, accurate and matched to search intent. Avoid clickbait and unsupported claims."],["Content gap","Compare my supplied page with the verified top-ranking pages for the same search intent. Find useful missing topics, explanations, evidence and user questions. Recommend improvements. Do not add sections just to increase word count."],["Technical issues","Here is my PageSpeed Insights or Search Console report. Explain each issue in simple language: what it means, why it matters, evidence, likely cause, fix, whether developer access is needed and how to retest. My platform is: [WordPress / Shopify / custom]."],["Schema","Create valid JSON-LD for the supplied page using verified details only. Explain the schema type, eligibility, implementation and validation steps. Do not invent reviews, ratings, prices, addresses or business details."],["Action plan","Using the verified audit findings, classify each issue by business impact, urgency and effort. Give critical, high, medium and low tasks, five quick wins, a 30-day plan and metrics. Do not guarantee ranking improvements."]]],["q","AI explains. Google confirms."]],"p":"AI helps you draft and explain. You still verify.","f":"A prompt is like giving the tailor exact measurements. A vague request gives a badly fitting shirt. Always check the stitching before wearing it.","y":"Copy the on-page audit prompt, paste one of your pages, and mark which AI suggestions you can verify.","a":["🐒","Kapi the Monkey"],"mv":"In Enthiran, Chitti follows instructions literally. AI does too, so write precise prompts, then verify the answer."},{"t":"Beyond SEO: ads, social and email","s":[["Paid search","Google Ads: Search, Performance Max, Demand Gen and Video campaigns. Use match types, negative keywords, Responsive Search Ads, assets and conversion tracking."],["Paid social","Meta Ads: pick an objective, define audiences, test creatives, and use the Pixel and Conversions API for conversion tracking."],["Organic social and messaging","Plan content pillars, Reels and carousels, and manage the community. For email and WhatsApp, build consented lists, segment them, and write clear subject lines and CTAs."]],"m":"Running ads or messages without conversion tracking or consent.","k":"Know what each channel adds, and measure all of them.","q":[["ROAS means…",["Return on ad spend","Rate of ad sales","Reach of ad spend"],0,"Revenue earned per unit of ad cost."],["Negative keywords…",["Block irrelevant searches","Raise bids","Add new ads"],0,"They stop wasted clicks."],["Email and WhatsApp marketing needs…",["Consent","Many hashtags","Paid links"],0,"Message only people who agreed."]],"v":[["x","Google Ads topics",["Search campaigns","Performance Max","Demand Gen","Video campaigns","Keyword match types","Negative keywords","Responsive Search Ads","Ad assets","Bidding strategies","Quality Score","Conversion tracking","Google Ads and GA4 integration"]],["x","Ad metrics",["CTR","CPC","CPA","ROAS","Conversions"]],["x","Meta Ads topics",["Campaign objectives","Audience targeting","Advantage+ products","Campaign creatives","Lead generation","Pixel","Conversions API","Conversion tracking","Creative testing"]],["x","Social media marketing",["Content pillars","Reels","Carousels","Audience engagement","Posting strategy","Social analytics","Paid vs organic distribution","Community management"]],["x","Email and WhatsApp marketing",["Email lists","Welcome sequences","Segmentation","Subject lines","Calls to action","Campaign performance","Consent-based messaging","Customer follow-up"]]],"p":"SEO is not the only channel. Know what ads, social and email add.","f":"SEO is a free water tap: slow but steady. Ads are a water tanker: fast, but you pay for every trip.","y":"Pick one goal, such as calls. Name which channel you would test first and how you would measure it.","a":["🦅","Eagle"],"mv":"A film release uses posters (ads), trailers (social), songs (email and WhatsApp) and word of mouth (SEO). A blockbuster uses all of them and counts the box office."}];
    const RESEARCH_EXT = [{"guideTitle":"Research Framework: Business-First SEO Discovery","sections":[["Revenue & Funnel Alignment","Traffic without buyer intent inflates analytics but yields zero business return. Map every high-priority URL to a clear commercial objective: direct purchase, qualified lead form, phone booking, or product trial."],["Stakeholder & Tracking Audit","Before proposing technical tickets, audit existing Google Analytics 4 (GA4) key events, Google Search Console (GSC) property verification (Domain vs URL-prefix), and CRM attribution to ensure baseline conversions are actually measured."]],"framework":["Domain Ownership & GSC Check","Primary Revenue Products/Services","Target Buyer Geography & Language","Top 3 Organic Business Competitors"]},{"guideTitle":"Deep Dive: Google Search Rendering & Indexation Pipeline","sections":[["Discovery vs Crawl vs Index Distinction","A URL discovered via XML sitemap is queued for crawling; after fetching the HTTP 200 payload, Web Rendering Service (WRS) executes scripts on evergreen Chromium to extract the final DOM before indexing decides whether to store it."],["Canonical Selection & Duplicate Handling","Google treats http/https, www/non-www, and URL parameters (?sort=, ?utm_) as distinct URLs until canonicalized. Always verify Google-selected canonical vs user-declared canonical inside GSC URL Inspection."]],"table":["Search Pipeline Stage Diagnostics",["Stage","What Happens","Failure Mode","Diagnostic Tool"],[["1. Discovery","Found via internal links or XML sitemap","Orphan URL with zero internal links","Site Crawl + XML Sitemap Audit"],["2. Crawling","Googlebot fetches HTTP status code","Blocked by robots.txt or 5xx timeout","Server Logs + robots.txt Tester"],["3. Rendering","Headless Chromium runs JS & CSS","Key text requires click/scroll event","GSC URL Inspection Screenshot"],["4. Indexing","Signals evaluated & stored in index","'Crawled - currently not indexed' quality filter","GSC Page Indexing Report"],["5. Serving","Matched & ranked to user search intent","Wrong intent page or duplicate cannibalization","GSC Performance Queries Report"]]]},{"guideTitle":"Search Intent Matrix & Keyword Clustering Method","sections":[["SERP-First Intent Verification","Never guess intent from a keyword phrase alone. Inspect the live top 10 organic results: if 8 of 10 results are detailed blog guides, a product category page will rarely rank; match the dominant format."],["Hub-and-Spoke Semantic Clustering","Group closely related queries that share the same search intent onto one comprehensive page rather than creating separate thin pages for plural/synonym variations."]]},{"guideTitle":"Competitive Gap & Reverse-Engineering Protocol","sections":[["Business Competitors vs SERP Competitors","A software blog, dictionary site, or comparison directory may outrank your direct store on informational queries. Separate true direct business rivals from informational SERP competitors before budgeting content effort."],["Information Gain Opportunity","Analyze the top 5 ranking pages for unanswered follow-up questions, missing real screenshots, outdated statistics, or unclear tables—then build your page to directly solve those omissions."]]},{"guideTitle":"Semantic HTML & On-Page Clarity Principles","sections":[["Descriptive Headings & Scannability","Use a single logical H1 matching the primary page topic, followed by nested H2/H3 headings that reflect sub-questions users expect answered. Avoid cramming identical exact-match phrases into every heading."],["Contextual Internal Linking Architecture","Links inside main body paragraphs pass stronger topical context than footer menus alone. Use clear descriptive anchor text explaining what the destination page covers rather than generic phrases like 'click here'."]]},{"guideTitle":"Technical Infrastructure & Crawl Efficiency","sections":[["HTTP Header & Redirect Chain Hygiene","Multi-hop redirect chains (e.g. HTTP -> HTTPS -> non-www -> new-slug) waste crawl budget and dilute link equity. Update internal links to point directly to the final HTTP 200 canonical URL."],["Robots.txt vs Meta Robots (Noindex) Conflict","Never block a URL in robots.txt if you also placed a meta noindex tag on it. Googlebot must be allowed to crawl the page to read the noindex directive and drop it from search results."]]},{"guideTitle":"Core Web Vitals Engineering Targets (CrUX Field Data)","sections":[["Understanding INP (Replaced FID in March 2024)","Interaction to Next Paint (INP) measures visual responsiveness across ALL taps, clicks, and keystrokes during a visit (target <= 200 ms), unlike legacy FID which only checked the first interaction."],["Practical Optimization Sequence","Optimize LCP (<= 2.5 s) by removing lazy-loading from the hero image and optimizing TTFB. Stabilize CLS (<= 0.1) by reserving explicit CSS aspect-ratio/width/height space for images, ads, and embeds."]]},{"guideTitle":"Content Consolidation & Cannibalization Resolution","sections":[["Diagnosing Keyword Cannibalization","When two URLs on your domain alternate rankings for the same query inside GSC, neither builds peak authority. Merge the weaker post's unique insights into the primary URL and apply a 301 redirect."],["Pruning vs Updating Strategy","Update seasonally outdated statistics with current data. Only de-index or remove pages that attract zero organic impressions, zero backlinks, and serve no user purpose."]]},{"guideTitle":"Editorial Quality, E-E-A-T & Reader Retention","sections":[["Front-Loading Direct Answers","Place a concise 2-to-3 sentence direct answer immediately beneath major headings before expanding with nuance. This improves human comprehension and increases extractability for featured snippets."],["Demonstrating First-Hand Experience","Include proprietary workflows, original step-by-step screenshots, concrete pros/cons, and transparent author bios showing real-world practitioner experience."]]},{"guideTitle":"Natural Authority Building & Risk Evaluation","sections":[["Understanding Third-Party Metrics Correctly","Domain Authority (Moz), Domain Rating (Ahrefs), and Toxic Scores are third-party estimates—Google does not use them in its ranking systems. Focus on topical relevance and real editorial editorial referrals."],["Creating Genuine Linkable Assets","Free interactive calculators, original industry survey data, curated research templates, and clear visual glossaries naturally earn citations from journalists and niche writers."]]},{"guideTitle":"Local Pack Signals: Relevance, Distance & Prominence","sections":[["Google's Three Official Local Factors","Local Pack visibility depends on Relevance (profile categories & services), Distance (proximity to searcher), and Prominence (reviews, local citations, and organic site authority)."],["Review Ethics & Policy Compliance","Never offer discounts, gifts, or money in exchange for reviews—that violates Google Business Profile policies and risks suspension. Respond promptly and professionally to both praise and criticism."]]},{"guideTitle":"Measurement Mastery: GSC & GA4 Implementation","sections":[["Diagnosing Indexing Bucket Differences","'Discovered - currently not indexed' points to crawl capacity or weak internal links; 'Crawled - currently not indexed' indicates Google inspected the page and judged quality/uniqueness insufficient."],["Filter Non-Branded Queries with GSC Regex","Use Regex exclusion in GSC Performance (`^(?!.*brandname).*$`) to isolate true discovery queries and track non-branded SEO acquisition growth accurately."]]},{"guideTitle":"AI Search Architecture: AEO, GEO & Entity Clarity","sections":[["Fact-Dense Structuring for AI Synthesis","AI answer engines decompose complex queries into sub-queries (query fan-out) and favor pages stating crisp facts, named entities, verifiable statistics, and structured comparison tables."],["Verify Before Following Speculative Trends","Avoid investing time into unproven claims like hidden llms.txt files guaranteeing citations. Focus on crawlable HTML, Schema.org accuracy, original research, and recognizable brand authority."]]},{"guideTitle":"Prioritization Matrix: Turning Audits Into Roadmaps","sections":[["Impact vs Implementation Effort","A perfect 100-item audit fails if everything is marked Critical. Sequence fixes strictly by: (1) Revenue/Crawl blockers -> (2) Quick-win high-impression CTR improvements -> (3) Long-term content hubs."],["Separate Verified Issues From Hypotheses","Always clearly label concrete technical errors observed directly vs strategic recommendations requiring developer verification or testing."]]},{"guideTitle":"Weekly SEO Operations & Executive Reporting","sections":[["Reporting Business Outcomes Over Vanity Ranks","Stakeholders care about qualified non-branded sessions, organic leads/revenue, indexed coverage health, and share of visibility across priority clusters—not single-day rank fluctuations."],["Maintenance Rhythm","Spend Monday-Wednesday auditing and shipping improvements, Thursday-Friday publishing/refreshing content, and Friday afternoon reviewing GSC trends to prioritize the following week."]]},{"guideTitle":"Human-In-The-Loop AI Workflow Discipline","sections":[["Ground AI With Exported Primary Data","AI models do not see live search volumes or your live server logs unless you paste/upload exported CSVs from GSC, Screaming Frog, or GA4 directly into context."],["Verification Checklist Before Shipping","Treat AI output as a first draft or diagnostic brainstorm. Always inspect every schema block in Rich Results Test and confirm facts against Google Search Central documentation."]]},{"guideTitle":"Omnichannel Demand & Growth Multiplier","sections":[["Paid + Organic Search Feedback Loop","Use Google Ads Search Terms reports to identify exact high-converting buyer queries immediately, then build permanent SEO landing pages targeting those proven phrases to lower blended CAC over time."],["Distribution Beyond Search Engines","Combine strong SEO search foundations with YouTube tutorials, LinkedIn thought leadership, and opt-in email nurturing so repeat brand searches build durable direct demand."]]}];

    const MASTER = "Act as a senior full-stack developer, UI/UX designer, instructional designer and technical SEO specialist. Build or extend the SEO Learning Academy so it runs locally in VS Code (Next.js App Router, TypeScript, Tailwind; or one HTML file for a prototype).\n\nLEARNING FLOW: dashboard, topic map, then for every topic: In simple words, Fun example, Tamil cinema moment, detailed lesson with charts, tables and checklists, Try it yourself, Common mistake, Key takeaway, then a quiz that unlocks only after reading. Pass with 2 of 3 right.\n\nTOPICS (cover all in detail): business overview; how search works; keyword research; competitor analysis; on-page; technical (redirects, errors, sitemaps, robots.txt, canonicals); Core Web Vitals (LCP, INP, CLS); content audit; content marketing and blogging; backlinks and off-page; local SEO with the 30-day Business Profile plan; Search Console, GA4 and Tag Manager; AEO, GEO, AIO and SXO; audit score and priorities; weekly workflow and reporting; AI prompts; ads, social and email; tools directory; 100 AI agents.\n\nSTYLE: red theme (deep red, coral, gold accents) on a cream grid background; an animal guide for every topic; smooth entrance animations, hover lifts, bobbing mascots and confetti on a passed quiz; respect prefers-reduced-motion; responsive and accessible.\n\nTAMIL CINEMA: one short, accurate movie analogy per topic (for example Kaithi, Anniyan, Thalapathi). Use only real plot ideas and never invent quotes for real people.\n\nACCURACY: official documentation first. No fixed title or meta length rules, INP instead of FID, Domain Authority is a Moz metric, no guaranteed rankings, FAQ rich results, llms.txt benefits or AI citations. Label every sample number as Sample data. AI explains, Google confirms.\n\nDELIVER: runnable code, lesson content in editable data files, a README and a checklist of what works.";

    const BASE_PL = [{"g":"Writers","n":"Blog post writer","t":"Act as an SEO content writer. Write a helpful, people-first blog post for {business} ({url}). Primary keyword: {keyword}. Audience: {audience}. Location: {city}. First state the search intent in one line. Then write a catchy title, an introduction that answers the main question, H2 and H3 sections with short paragraphs and relevant examples, a short FAQ, a conclusion and a clear CTA. Use the keyword naturally and suggest internal link spots. Do not invent statistics, quotes or sources, and mark anything that needs fact-checking."},{"g":"Writers","n":"Blog brief and outline","t":"Create a content brief for the keyword {keyword} for {audience}. Include search intent, reader questions, three title options, the H1, an H2 and H3 outline, key points to cover, examples to add, internal link ideas, a CTA and a fact-check list. Do not invent data."},{"g":"Writers","n":"Pre-publish blog checker","t":"Act as an editor. Check this blog before publishing: [paste blog]. Target keyword: {keyword}. Check keyword research and search intent, SEO-friendly title, proper headings, internal and external links, optimised images, meta title and description, factual accuracy, readability and a clear CTA. Give a pass or fix verdict for each item with the exact change needed. Do not invent sources."},{"g":"Writers","n":"Content refresher","t":"Update this older article for {keyword}: [paste article]. Fix outdated facts, improve clarity and structure, add missing questions and examples, keep what already works and list every change you made. Flag claims that need a source."},{"g":"Writers","n":"Title and meta writer","t":"Write five title tag options and five meta descriptions for a page about {keyword} for {business}. Keep each clear, natural, accurate and matched to search intent. No clickbait or unsupported claims. Google sets no fixed length, so keep them readable."},{"g":"Writers","n":"FAQ writer","t":"Write six FAQs about {keyword} for {audience} in {city}. Give each answer in two or three plain sentences, based on verifiable knowledge, and flag anything that needs checking. Do not promise FAQ rich results."},{"g":"Writers","n":"Service page writer","t":"Write a service page for {business} offering {keyword} in {city}. Include a clear H1, who it is for, benefits, how it works in steps, FAQs and a CTA. Use placeholders for proof I must supply, such as reviews and numbers. Do not invent any."},{"g":"Writers","n":"Business Profile posts","t":"Write three Google Business Profile posts for {business} in {city} about {keyword}. Keep each short and genuine with one clear CTA. No exaggerated claims and no incentives for reviews."},{"g":"Writers","n":"Business Profile description","t":"Write an accurate Google Business Profile description for {business} in {city}: what we offer, who we serve and what makes us different. Use only facts I give you. No keyword stuffing and no promotions."},{"g":"Writers","n":"Review reply writer","t":"Write two professional, warm replies to customer reviews for {business}: one positive and one negative. Thank them, address specifics, stay honest and invite them to contact us. Do not offer rewards. Review text: [paste review]."},{"g":"Writers","n":"Social caption writer","t":"Write five social media captions for {business} about {keyword}. Put the catchy hook in the first 5 to 6 words, keep each concise because platforms cut text after a few lines, add one clear CTA and three relevant hashtags. No false claims."},{"g":"Writers","n":"Reel and carousel script","t":"Turn this blog into a 30-second reel script and a 7-slide carousel for {audience}. Start with a hook in the first 5 to 6 words, one idea per slide and end with a CTA. Blog text: [paste blog]."},{"g":"Writers","n":"Email and WhatsApp message","t":"Write a short email and a WhatsApp message from {business} to {audience} about {keyword}. Include a clear subject line, one CTA and an opt-out line. This is only             <path d="M0,25 C320,55 480,0 760,28 C1040,56 1260,8 1440,30 L1440,50 L0,50 Z"></path>
          </svg>
        </div>
      `;
    }

    // Render all rich widget blocks inside topic.v (c, t, k, b, p, g, x, w, pr, q) cleanly with zero emoji clutter
    function renderVisualBlock(block, tIdx, bIdx) {
      if (!Array.isArray(block)) return '';
      const type = block[0];
      const title = block[1];

      // 1. Interactive Checklist ['c', title, items]
      if (type === 'c') {
        const items = toArr(block[2]);
        return `
          <div style="margin:18px 0">
            <h4 style="font-size:14.5px;font-weight:800;margin-bottom:10px;color:var(--text)">${esc(title)}</h4>
            <div style="display:flex;flex-direction:column;gap:8px">
              ${items.map((item, i) => {
                const key = `${tIdx}-v-${bIdx}-${i}`;
                const chk = !!S.chk?.[key];
                return `
                  <label style="display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;background:var(--surface-alt);border:1px solid var(--border);cursor:pointer;font-size:13.5px">
                    <input type="checkbox" style="width:16px;height:16px;accent-color:var(--blue);flex-shrink:0" ${chk?'checked':''} onchange="(S.chk=S.chk||{})['${key}']=!S.chk['${key}'];sv();render()">
                    <span style="${chk?'text-decoration:line-through;color:var(--text-light)':'color:var(--text)'}">${esc(item)}</span>
                  </label>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      // 2. Data Table ['t', title, headers, rows, isSample]
      if (type === 't') {
        const headers = toArr(block[2]);
        const rows = toArr(block[3]);
        const isSample = !!block[4];
        return `
          <div style="margin:20px 0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <h4 style="font-size:14.5px;font-weight:800">${esc(title)}</h4>
              ${isSample ? '<span class="sample-pill">Sample Data</span>' : ''}
            </div>
            <div class="data-table-wrap">
              <table class="seo-table">
                <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
                <tbody>
                  ${rows.map(r => `<tr>${toArr(r).map(cell => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // 3. KPI Grid ['k', title, [[label, val, note], ...], isSample]
      if (type === 'k') {
        const items = toArr(block[2]);
        const isSample = !!block[3];
        return `
          <div style="margin:20px 0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <h4 style="font-size:14.5px;font-weight:800">${esc(title)}</h4>
              ${isSample ? '<span class="sample-pill">Sample Data</span>' : ''}
            </div>
            <div class="metric-kpi-grid">
              ${items.map(it => `
                <div class="metric-kpi-box">
                  <div class="metric-kpi-label">${esc(it[0])}</div>
                  <div class="metric-kpi-val">${esc(it[1])}</div>
                  ${it[2] ? `<div class="metric-kpi-note">${esc(it[2])}</div>` : ''}
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      // 4. Bar Chart ['b', title, [[label, num], ...], unit, isSample]
      // 5. Distribution Proportions ['p', title, [[label, num], ...], isSample]
      if (type === 'b' || type === 'p') {
        const items = toArr(block[2]);
        const unit = type === 'b' ? (block[3] || '') : '';
        const isSample = type === 'b' ? !!block[4] : !!block[3];
        const maxVal = Math.max(...items.map(it => Number(it[1]) || 0), 1);
        return `
          <div style="margin:20px 0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <h4 style="font-size:14.5px;font-weight:800">${esc(title)}</h4>
              ${isSample ? '<span class="sample-pill">Sample Data</span>' : ''}
            </div>
            <div class="bar-chart-box">
              ${items.map(it => {
                const v = Number(it[1]) || 0;
                const w = Math.max(4, Math.min(100, Math.round((v / maxVal) * 100)));
                return `
                  <div class="bar-row">
                    <div class="bar-meta"><span>${esc(it[0])}</span><span>${esc(it[1])} ${esc(unit)}</span></div>
                    <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      // 6. Score Gauges ['g', title, [[score, category, label], ...], isSample]
      if (type === 'g') {
        const items = toArr(block[2]);
        const isSample = !!block[3];
        return `
          <div style="margin:20px 0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <h4 style="font-size:14.5px;font-weight:800">${esc(title)}</h4>
              ${isSample ? '<span class="sample-pill">Sample Data</span>' : ''}
            </div>
            <div class="metric-kpi-grid">
              ${items.map(it => `
                <div class="metric-kpi-box">
                  <div class="metric-kpi-label">${esc(it[1])}</div>
                  <div class="metric-kpi-val">${esc(it[0])}/100</div>
                  <div class="metric-kpi-note">${esc(it[2])}</div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      // 7. Reference Concept Chips ['x', title, items, isSample]
      if (type === 'x') {
        const items = toArr(block[2]);
        const isSample = !!block[3];
        return `
          <div style="margin:18px 0">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <h4 style="font-size:14.5px;font-weight:800">${esc(title)}</h4>
              ${isSample ? '<span class="sample-pill">Sample Data</span>' : ''}
            </div>
            <div class="concept-chips-wrap">
              ${items.map(x => `<span class="concept-chip">${esc(x)}</span>`).join("")}
            </div>
          </div>
        `;
      }

      // 8. Warning / Anti-patterns ['w', title, items]
      if (type === 'w') {
        const items = toArr(block[2]);
        return `
          <div class="callout-block danger">
            <div style="font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:7px">${SVG.alert} <span>${esc(title)}</span></div>
            <ul style="padding-left:20px;display:flex;flex-direction:column;gap:4px">
              ${items.map(it => `<li>${esc(it)}</li>`).join("")}
            </ul>
          </div>
        `;
      }

      // 9. Inline Copy-Ready Prompts ['pr', title, [[name, promptText], ...]]
      if (type === 'pr') {
        const items = toArr(block[2]);
        return `
          <div style="margin:20px 0">
            <h4 style="font-size:14.5px;font-weight:800;margin-bottom:10px">${esc(title)}</h4>
            <div style="display:flex;flex-direction:column;gap:12px">
              ${items.map((pr, pIdx) => `
                <div style="padding:16px;border-radius:14px;background:var(--surface-alt);border:1px solid var(--border)">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <b style="font-size:14px">${esc(pr[0])}</b>
                    <button class="btn btn-soft btn-sm" onclick="copyLessonPrompt(${tIdx},${bIdx},${pIdx})">${SVG.copy} Copy Prompt</button>
                  </div>
                  <div style="font-family:var(--mono);font-size:12px;color:var(--text-muted);line-height:1.55">${esc(pr[1])}</div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      // 10. Core Principle Quote ['q', quote]
      if (type === 'q') {
        return `
          <div class="callout-block" style="background:var(--blue-soft);font-weight:600;color:var(--text)">
            <b>Key Principle:</b> ${esc(title)}
          </div>
        `;
      }
      return '';
    }

    function switchBuddyTip() {
