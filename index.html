    function startQuiz(idx) {
      Z.i = idx; Z.v = "quiz"; Z.quizQIdx = 0; Z.quizAnswers = [];
      render();
    }

    function submitQuizAnswer(chosen) {
      const topics = getCurriculum();
      const qList = (topics[Z.i] || topics[0]).q || [];
      const qObj = normQ(qList[Z.quizQIdx]);
      const isRight = chosen === qObj.correct;
      Z.quizAnswers.push(isRight);

      document.querySelectorAll(".quiz-opt-btn").forEach((b, i) => {
        b.disabled = true;
        if (i === qObj.correct) b.style.borderColor = "var(--emerald)";
        else if (i === chosen) b.style.borderColor = "var(--coral)";
      });

      const fb = $("#quiz-feedback-box");
      if (fb) {
        fb.style.display = "block";
        fb.innerHTML = `
          <div class="callout-block ${isRight ? 'success' : 'gold'}">
            <b>${isRight ? 'Correct:' : 'Explanation:'}</b> ${esc(qObj.why)}
          </div>
          <button class="btn btn-blue" style="width:100%" onclick="nextQuizStep()">
            ${Z.quizQIdx + 1 < qList.length ? 'Next Question →' : 'See Results'}
          </button>
        `;
      }
    }

    function nextQuizStep() {
      const topics = getCurriculum();
      const qList = (topics[Z.i] || topics[0]).q || [];
      if (Z.quizQIdx + 1 < qList.length) {
        Z.quizQIdx++;
        render();
      } else {
        const right = Z.quizAnswers.filter(Boolean).length;
        S.sc[Z.i] = right;
        addXp(right * 15, "Quiz Score");
        if (right === qList.length) boom();
        sv();
        Z.v = "res";
        render();
      }
    }

    function copyLessonPrompt(tIdx, bIdx, pIdx) {
      const t = getCurriculum()[tIdx];
      const blk = t?.v?.[bIdx];
      const txt = blk?.[2]?.[pIdx]?.[1];
      if (txt) copyTextDirect(txt);
    }

    function copyTextDirect(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => {
          S.promptsCopied = (S.promptsCopied || 0) + 1;
          sv();
          toast("Prompt copied to clipboard");
        }).catch(() => fallbackCopy(txt));
      } else fallbackCopy(txt);
    }

    function copyPromptText(idx) {
      const el = $("#pr-snip-" + idx);
      if (el) copyTextDirect(el.innerText || el.textContent);
    }

    function fallbackCopy(txt) {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); S.promptsCopied = (S.promptsCopied || 0) + 1; sv(); toast("Copied"); } catch(e) {}
      document.body.removeChild(ta);
    }

    // Multi-User & Multi-Admin Authentication Handlers
    function submitEmailLogin() {
      const email = ($("#login-email")?.value || "").trim().toLowerCase();
      const pass = ($("#login-pass")?.value || "").trim();
      if (!email || !pass) { Z.authError = "Please enter both your email address and password."; render(); return; }

      const acc = (S.accounts || []).find(a => a.email.toLowerCase() === email);
      if (!acc || acc.password !== pass) {
        Z.authError = "Invalid email or password. Try a demo account below or Sign Up.";
        render();
        return;
      }

      syncActiveAccountToStore();
      loadAccountSession(acc);
      Z.authError = "";
      sv();
      toast("Signed in as " + acc.name + " (" + getCenterName(acc.centerId) + ")");
      navTo(acc.role === "admin" && Z.loginTab === "admin" ? "admin" : "dash");
    }

    function quickDemoLogin(email, pass) {
      const acc = (S.accounts || []).find(a => a.email.toLowerCase() === email.toLowerCase() && a.password === pass);
      if (!acc) return;
      syncActiveAccountToStore();
      loadAccountSession(acc);
      Z.authError = "";
      sv();
      toast("Signed in as " + acc.name);
      navTo(acc.role === "admin" ? "admin" : "dash");
    }

    function registerNewAccount() {
      const name = ($("#reg-name")?.value || "").trim();
      const email = ($("#reg-email")?.value || "").trim().toLowerCase();
      const pass = ($("#reg-pass")?.value || "").trim();
      const pass2 = ($("#reg-pass2")?.value || "").trim();
      const role = $("#reg-role")?.value || "user";
      const centerId = $("#reg-center")?.value || S.centers[0]?.id || "c_main";
      const buddy = document.querySelector('input[name="reg-buddy"]:checked')?.value || "tara";
      const invite = ($("#reg-invite")?.value || "").trim();

      if (!name || !email || !email.includes("@")) {
        Z.authError = "Please enter your full name and a valid email address.";
        render(); return;
      }
      if (pass.length < 6) {
        Z.authError = "Password must be at least 6 characters long.";
        render(); return;
      }
      if (pass !== pass2) {
        Z.authError = "Passwords do not match.";
        render(); return;
      }
      if ((S.accounts || []).some(a => a.email.toLowerCase() === email)) {
        Z.authError = "An account with this email already exists. Please Sign In instead.";
        render(); return;
      }
      if (role === "admin" && invite !== (S.adminInviteCode || "ADMIN2026")) {
        Z.authError = "Invalid Admin Invite Code. Default invite code is ADMIN2026.";
        render(); return;
      }

      syncActiveAccountToStore();
      const newAcc = {
        id: "acc_" + Date.now(),
        name,
        email,
        password: pass,
        role,
        centerId,
        goal: role === "admin" ? "Center Administrator" : "Master Modern SEO & AI Search",
        buddy,
        joined: new Date().toISOString().slice(0, 10),
        progress: { xp: 0, streak: 1, sc: {}, chk: {}, bookmarks: [], cinemaCount: 0, promptsCopied: 0 }
      };
      S.accounts.push(newAcc);
      loadAccountSession(newAcc);
      Z.authError = "";
      sv();
      toast("Account created for " + name);
      navTo(role === "admin" ? "admin" : "dash");
    }

    function logoutAccount() {
      syncActiveAccountToStore();
      S.activeAccountId = null;
      S.isAdminAuth = false;
      S.xp = 0; S.streak = 1; S.sc = {}; S.chk = {}; S.bookmarks = [];
      S.user = { name: "Guest Learner", email: "", role: "Guest", goal: "Explore Academy", centerId: S.centers[0]?.id || "c_main" };
      sv();
      Z.authError = "";
      toast("Signed out cleanly");
      navTo("login");
    }

    function saveProfileSettings() {
      const acc = getActiveAccount();
      if (!acc) return;
      const name = ($("#prof-name")?.value || "").trim();
      const centerId = $("#prof-center")?.value || acc.centerId;
      const goal = ($("#prof-goal")?.value || "").trim();
      const pass = ($("#prof-pass")?.value || "").trim();

      if (name) { acc.name = name; S.user.name = name; }
      acc.centerId = centerId; S.user.centerId = centerId;
      if (goal) { acc.goal = goal; S.user.goal = goal; }
      if (pass) {
        if (pass.length < 6) return toast("New password must be at least 6 chars");
        acc.password = pass;
      }
      sv();
      toast("Account settings updated");
      render();
    }

    function quickAdminAuth() {
      const email = ($("#quick-admin-email")?.value || "").trim().toLowerCase();
      const pass = ($("#quick-admin-pass")?.value || "").trim();
      const acc = (S.accounts || []).find(a => a.email.toLowerCase() === email && a.password === pass && a.role === "admin");
      if (acc) {
        syncActiveAccountToStore();
        loadAccountSession(acc);
        Z.authError = "";
        sv();
        toast("Admin signed in: " + acc.name);
        render();
        return;
      }
      // Fallback compatibility if only default passkey used without email
      if (!email && pass === S.adminPass) {
        S.isAdminAuth = true; Z.authError = ""; sv(); toast("Unlocked"); render(); return;
      }
      Z.authError = "Invalid Admin email or password.";
      render();
    }

    // Multi-User & Multi-Admin CRUD
    function adminCreateAccount() {
      const name = ($("#adm-new-acc-name")?.value || "").trim();
      const email = ($("#adm-new-acc-email")?.value || "").trim().toLowerCase();
      const pass = ($("#adm-new-acc-pass")?.value || "").trim();
      const role = $("#adm-new-acc-role")?.value || "user";
      const centerId = $("#adm-new-acc-center")?.value || S.centers[0]?.id;

      if (!name || !email || !email.includes("@")) return toast("Valid name & email required");
      if (pass.length < 6) return toast("Password must be at least 6 characters");
      if ((S.accounts || []).some(a => a.email.toLowerCase() === email)) return toast("Email already registered");

      S.accounts.push({
        id: "acc_" + Date.now(),
        name, email, password: pass, role, centerId,
        goal: role === "admin" ? "Center Administrator" : "Enrolled Learner",
        buddy: "tara",
        joined: new Date().toISOString().slice(0, 10),
        progress: { xp: 0, streak: 1, sc: {}, chk: {}, bookmarks: [], cinemaCount: 0, promptsCopied: 0 }
      });
      sv();
      toast(`Created ${role === 'admin' ? 'Admin' : 'Student'}: ${name}`);
      render();
    }

    function openEditAccountModal(accId) {
      const acc = (S.accounts || []).find(a => a.id === accId);
      if (!acc) return;
      openModal(`
        <h2 style="font-size:19px;font-weight:800;margin-bottom:14px">Edit Account: ${esc(acc.name)}</h2>
        <div class="form-group"><label>Full Name</label><input class="form-control" id="ed-acc-name" value="${esc(acc.name)}"></div>
        <div class="form-group"><label>Email</label><input type="email" class="form-control" id="ed-acc-email" value="${esc(acc.email)}"></div>
        <div class="grid-2" style="gap:12px">
          <div class="form-group">
            <label>Role</label>
            <select class="form-control" id="ed-acc-role">
              <option value="user" ${acc.role!=='admin'?'selected':''}>Student</option>
              <option value="admin" ${acc.role==='admin'?'selected':''}>Admin</option>
            </select>
          </div>
          <div class="form-group">
            <label>Center</label>
            <select class="form-control" id="ed-acc-center">
              ${(S.centers || []).map(c => `<option value="${esc(c.id)}" ${c.id===acc.centerId?'selected':''}>${esc(c.name)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="form-group"><label>Reset Password (optional)</label><input type="password" class="form-control" id="ed-acc-pass" placeholder="Leave blank to keep unchanged"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px">
          <button class="btn btn-soft btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-blue btn-sm" onclick="saveAccountEditModal('${esc(acc.id)}')">Save Changes</button>
        </div>
      `);
    }

    function saveAccountEditModal(accId) {
      const acc = (S.accounts || []).find(a => a.id === accId);
      if (!acc) return;
      const name = ($("#ed-acc-name")?.value || "").trim();
      const email = ($("#ed-acc-email")?.value || "").trim().toLowerCase();
      const role = $("#ed-acc-role")?.value || acc.role;
      const centerId = $("#ed-acc-center")?.value || acc.centerId;
      const pass = ($("#ed-acc-pass")?.value || "").trim();

      if (!name || !email) return toast("Name and email required");
      if ((S.accounts || []).some(a => a.id !== accId && a.email.toLowerCase() === email)) return toast("Email taken by another account");

      acc.name = name;
      acc.email = email;
      acc.role = role;
      acc.centerId = centerId;
      if (pass) acc.password = pass;

      if (acc.id === S.activeAccountId) {
        S.user.name = acc.name;
        S.user.email = acc.email;
        S.user.centerId = acc.centerId;
        S.user.role = acc.role === "admin" ? "Center Admin" : "Student";
        S.isAdminAuth = acc.role === "admin";
      }
      sv();
      closeModal();
      toast("Account updated");
      render();
    }

    function adminDeleteAccount(accId) {
      if (accId === S.activeAccountId) return toast("Cannot delete the currently logged-in account");
      S.accounts = (S.accounts || []).filter(a => a.id !== accId);
      sv();
      toast("Account removed");
      render();
    }

    // Multi-Center CRUD
    function adminCreateCenter() {
      const name = ($("#adm-new-c-name")?.value || "").trim();
      const city = ($("#adm-new-c-city")?.value || "").trim() || "Branch";
      const code = ($("#adm-new-c-code")?.value || "").trim().toUpperCase() || ("CTR-" + String(S.centers.length + 1).padStart(2, "0"));
      if (!name) return toast("Center name required");
      S.centers.push({ id: "c_" + Date.now(), name, city, code });
      sv();
      toast("Added center: " + name);
      render();
    }

    function openEditCenterModal(cId) {
      const ctr = (S.centers || []).find(c => c.id === cId);
      if (!ctr) return;
      openModal(`
        <h2 style="font-size:19px;font-weight:800;margin-bottom:14px">Edit Center: ${esc(ctr.name)}</h2>
        <div class="form-group"><label>Center Name</label><input class="form-control" id="ed-c-name" value="${esc(ctr.name)}"></div>
        <div class="form-group"><label>City / Region</label><input class="form-control" id="ed-c-city" value="${esc(ctr.city)}"></div>
        <div class="form-group"><label>Branch Code</label><input class="form-control" id="ed-c-code" value="${esc(ctr.code)}"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px">
          <button class="btn btn-soft btn-sm" onclick="closeModal()">Cancel</button>
          <button class="btn btn-blue btn-sm" onclick="saveCenterEditModal('${esc(ctr.id)}')">Save Center</button>
        </div>
      `);
    }

    function saveCenterEditModal(cId) {
      const ctr = (S.centers || []).find(c => c.id === cId);
      if (!ctr) return;
      const name = ($("#ed-c-name")?.value || "").trim();
      if (!name) return toast("Center name required");
      ctr.name = name;
      ctr.city = ($("#ed-c-city")?.value || "").trim() || ctr.city;
      ctr.code = ($("#ed-c-code")?.value || "").trim().toUpperCase() || ctr.code;
      sv();
      closeModal();
      toast("Center updated");
      render();
    }

    function adminDeleteCenter(cId) {
      if ((S.centers || []).length <= 1) return toast("At least one center is required");
      S.centers = S.centers.filter(c => c.id !== cId);
      const fallbackId = S.centers[0].id;
      (S.accounts || []).forEach(a => { if (a.centerId === cId) a.centerId = fallbackId; });
      if (S.user?.centerId === cId) S.user.centerId = fallbackId;
      sv();
      toast("Center removed (users reassigned)");
      render();
    }

    function saveAdminTopicEdit(idx) {
      S.customEdits[idx] = {
        ...(S.customEdits[idx] || {}),
        t: $("#adm-t")?.value,
        p: $("#adm-p")?.value,
        f: $("#adm-f")?.value,
        mv: $("#adm-mv")?.value
      };
      sv();
      toast("Saved changes to Topic " + nn(idx));
      render();
    }

    function saveAdminNewTopic() {
      const t = $("#new-t")?.value?.trim();
      if (!t) return toast("Title required");
      S.addedTopics.push({
        t,
        p: $("#new-f")?.value || "",
        f: $("#new-f")?.value || "",
        mv: $("#new-mv")?.value || "",
        a: ["", "Custom Guide"],
        s: [["Core Overview", $("#new-f")?.value || t]],
        k: "Apply official documentation standards before making site-wide changes.",
        m: "Skipping baseline validation prior to deployment.",
        q: [{ q: "Key focus of " + t + "?", options: ["Quality & Relevance", "Keyword Stuffing"], correct: 0, why: "Value always wins." }]
      });
      sv();
      toast("Published new study topic");
      Z.adminTab = "edit";
      render();
    }

    function saveAdminCustomPrompt() {
      const name = $("#new-pr-name")?.value?.trim();
      const prompt = $("#new-pr-body")?.value?.trim();
      if (!name || !prompt) return toast("Name and prompt required");
      S.customPrompts.push({ name, cat: $("#new-pr-cat")?.value || "General", prompt });
      sv();
      toast("Custom prompt saved");
      navTo("prompts");
    }

    function showCertModal() {
      const name = S.user?.name || "Learner";
      const center = getCenterName(S.user?.centerId);
      const cid = "SEO-ACAD-2026-" + String(name.length * 739 + 1042).slice(0, 6);
      openModal(`
        <div class="certificate-frame">
          <div style="font-size:11px;font-weight:800;letter-spacing:0.14em;color:#1d64f2;margin-bottom:8px">SEO LEARNING ACADEMY · ${esc(center.toUpperCase())}</div>
          <h1 style="font-size:24px;font-weight:900;color:#0f172a;margin-bottom:10px">CERTIFICATE OF EXCELLENCE</h1>
          <p style="font-size:13px;color:#64748b">This certifies that</p>
          <div style="font-size:28px;font-weight:900;color:#1d64f2;margin:8px 0 14px;border-bottom:2px solid #1d64f2;display:inline-block;padding:0 24px">${esc(name)}</div>
          <p style="font-size:13px;color:#475569;margin-bottom:20px">Successfully completed the Research Curriculum in Modern SEO, Technical Architecture, & AI Search Optimization.</p>
          <div style="display:flex;justify-content:space-between;font-size:11.5px;color:#64748b;border-top:1px dashed #cbd5e1;padding-top:14px">
            <span><b>ID:</b> ${cid}</span>
            <span><b>Mentors:</b> Tara & Dev</span>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
          <button class="btn btn-soft btn-sm" onclick="closeModal()">Close</button>
          <button class="btn btn-blue btn-sm" onclick="window.print()">Print Certificate</button>
        </div>
      `);
    }

    function downloadBackup() {
      syncActiveAccountToStore();
      const payload = {
        accounts: S.accounts,
        centers: S.centers,
        customEdits: S.customEdits,
        addedTopics: S.addedTopics,
        customPrompts: S.customPrompts,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "seo-academy-full-backup.json"; a.click();
      URL.revokeObjectURL(url);
      toast("Full backup downloaded");
    }

    function importBackupFile(input) {
      const f = input.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if (Array.isArray(data.accounts)) S.accounts = data.accounts;
          if (Array.isArray(data.centers)) S.centers = data.centers;
          if (data.customEdits) S.customEdits = data.customEdits;
          if (Array.isArray(data.addedTopics)) S.addedTopics = data.addedTopics;
          if (Array.isArray(data.customPrompts)) S.customPrompts = data.customPrompts;
          sv();
          toast("Backup restored cleanly");
          render();
        } catch(e) { toast("Invalid backup JSON file"); }
      };
      r.readAsText(f);
    }

    function copySupabaseSQL() {
      const sql = [
        "CREATE TABLE IF NOT EXISTS academy_state (",
        "  id TEXT PRIMARY KEY,",
        "  payload JSONB NOT NULL,",
        "  updated_at TIMESTAMPTZ DEFAULT NOW()",
        ");",
        "ALTER TABLE academy_state ENABLE ROW LEVEL SECURITY;",
        "CREATE POLICY \"Academy App Sync\" ON academy_state FOR ALL USING (true) WITH CHECK (true);"
      ].join("\n");
      copyTextDirect(sql);
      toast("Supabase SQL setup copied");
    }

    function saveCloudConfig() {
      S.cloudUrl = ($("#adm-cloud-url")?.value || "").trim().replace(/\/+$/, "");
      S.cloudKey = ($("#adm-cloud-key")?.value || "").trim();
      try { localStorage.setItem("seoq5", JSON.stringify(S)); } catch(e) {}
      if (!S.cloudUrl || !S.cloudKey) {
        Z.cloudStatus = "Local Mode";
        toast("Cleared cloud credentials (Local Mode active)");
        render();
        return;
      }
      pullFromCloud(true);
    }

    function factoryReset() {
      if (confirm("Reset all accounts, centers, and custom edits to factory defaults?")) { localStorage.removeItem("seoq5"); location.reload(); }
    }

    render();
    if (getCloudCreds().url && getCloudCreds().key) { pullFromCloud(false); }
  </script>
</body>
</html>
